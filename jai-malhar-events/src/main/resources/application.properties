spring.application.name=jai-malhar-events

# Admin login credentials must be supplied as environment variables or in the
# ignored config/local-secrets.properties file. Never put their values here.
spring.config.import=optional:file:./config/local-secrets.properties
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
